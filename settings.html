<!DOCTYPE html>
<html lang="kk" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>InfoX | Баптаулар</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <script src="quiz-data.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
    :root {
      --primary: #00f2a0;
      --accent: #00E0FF;
      --bg-body: #050505;
      --bg-gradient: radial-gradient(circle at 50% 0%, #1a3235 0%, #050505 60%);
      --surface: rgba(20, 20, 20, 0.7);
      --surface-border: rgba(255, 255, 255, 0.08);
      --text-main: #FFFFFF;
      --text-sec: #888888;
      --danger: #EB5757;
      --success: #27AE60;
      --ai-gradient: linear-gradient(135deg, #00f2a0 0%, #00E0FF 100%);
      --font: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg-body);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(14px);
    }

    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .field {
      margin-bottom: 14px;
    }
    .field:last-child { margin-bottom: 0; }

    .label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sec);
      margin-bottom: 6px;
    }

    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--surface-border);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary { background: var(--ai-gradient); color: #000; }
    .btn-danger {
      background: rgba(235, 87, 87, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
      z-index: 100;
    }
    #toast.show { opacity: 1; top: 30px; }
  </style>
</head>

<body>
  <div id="toast">Баптаулар сақталды!</div>

  <div class="container">
    <div class="top-bar">
      <button class="icon-btn" onclick="history.back() || location.assign('home.html')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>
      <div style="font-weight:800; font-size:16px;">Баптаулар</div>
      <button class="icon-btn" onclick="location.href='home.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
      </button>
    </div>

    <!-- PROFILE SETTINGS -->
    <div class="card">
      <div class="card-title">Жеке мәліметтер</div>
      <div class="field">
        <div class="label">Оқушы аты-жөні</div>
        <input class="input" id="setName" placeholder="Атыңыз" />
      </div>
      <div class="field">
        <div class="label">Сынып</div>
        <select class="input" id="setGrade">
          <option value="8">8-сынып</option>
          <option value="9">9-сынып</option>
          <option value="10">10-сынып</option>
          <option value="11">11-сынып</option>
        </select>
      </div>
      <div class="field">
        <div class="label">ҰБТ дайындық мақсаты</div>
        <input class="input" id="setGoal" placeholder="Мысалы: 120+ балл" />
      </div>
      <button class="btn btn-primary" onclick="saveSettings()">Сақтау</button>
    </div>

    <!-- DATA MANAGEMENT -->
    <div class="card">
      <div class="card-title">Деректерді басқару</div>
      <p style="font-size:12px; color:var(--text-sec); margin-bottom:14px; line-height:1.5;">
        Қажет болған жағдайда квиздер тарихы мен нәтижелерді тазартып, сынақтарды нөлден қайта бастауға болады.
      </p>
      <button class="btn btn-danger" onclick="resetAllProgress()">Прогресті нөлдеу</button>
    </div>
  </div>

  <script>
    function loadSettings() {
      if (!window.QuizStore) return;
      const user = QuizStore.getUser();
      document.getElementById('setName').value = user.name || '';
      document.getElementById('setGrade').value = user.grade || '11';
      document.getElementById('setGoal').value = user.goal || 'ҰБТ 120+ балл';
    }

    function saveSettings() {
      if (!window.QuizStore) return;
      const name = document.getElementById('setName').value.trim() || 'Азамат';
      const grade = document.getElementById('setGrade').value;
      const goal = document.getElementById('setGoal').value.trim();

      QuizStore.saveUser({ name, grade, goal });
      showToast("Баптаулар сақталды!");
    }

    function resetAllProgress() {
      if (!confirm("Барлық квиз нәтижелерін нөлдегіңіз келе ме?")) return;
      localStorage.removeItem('physx_quiz_attempts');
      localStorage.removeItem('physx_stats');
      localStorage.removeItem('physx_course_progress');
      localStorage.removeItem('physx_personal_plans');
      showToast("Прогресс нөлденді!");
      setTimeout(() => location.href = 'home.html', 800);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }

    document.addEventListener('DOMContentLoaded', loadSettings);
  </script>
</body>

</html>
