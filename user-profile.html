<!DOCTYPE html>
<html lang="kk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>InfoX | Жеке профиль</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <script src="quiz-data.js"></script>

  <style>
    *:focus { outline: none !important; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --primary-dim: rgba(37, 99, 235, 0.08);
      --primary-glow: rgba(37, 99, 235, 0.25);
      --accent: #06B6D4;
      --navy: #0F172A;
      --navy-light: #1E293B;
      --bg-body: #F5F8FC;
      --bg-gradient: linear-gradient(180deg, #EEF4FF 0%, #F5F8FC 40%, #F8FAFC 100%);
      --surface: #FFFFFF;
      --surface-highlight: #F8FAFC;
      --surface-border: #E2E8F0;
      --border: #E2E8F0;
      --text-main: #0F172A;
      --text-sec: #64748B;
      --danger: #EF4444;
      --success: #10B981;
      --ai-gradient: linear-gradient(135deg, #2563EB 0%, #06B6D4 100%);
      --font: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06);
      --radius-card: 20px;
    }

    body {
      font-family: var(--font);
      background: var(--bg-body);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 90px;
      -webkit-font-smoothing: antialiased;
    }

    .main {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 20px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 20px 0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--navy);
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .icon-btn:hover { background: var(--surface-highlight); border-color: var(--primary); color: var(--primary); }

    .title {
      font-size: 17px;
      font-weight: 800;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--primary-dim);
      border: 1px solid rgba(37, 99, 235, 0.2);
      color: var(--primary);
    }

    /* Hero */
    .profile-hero {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 20px;
      border-radius: var(--radius-card);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      margin-bottom: 16px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--primary-dim);
      border: 2px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 24px;
      color: var(--primary);
      flex-shrink: 0;
      font-family: var(--font-mono);
    }

    .hero-info { flex: 1; min-width: 0; }
    .hero-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 4px;
    }
    .hero-sub {
      display: flex;
      gap: 8px;
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 600;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .stat-num {
      font-size: 20px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 2px;
      font-family: var(--font-mono);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 18px;
      box-shadow: var(--shadow-md);
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--navy);
      margin: 18px 0 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Items */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--surface-highlight);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .item-row:hover {
      background: #EFF6FF;
      border-color: var(--primary);
    }

    .mini-track {
      width: 100%;
      height: 6px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .mini-fill {
      height: 100%;
      background: var(--ai-gradient);
      border-radius: 99px;
    }

    /* Form Fields */
    .field {
      margin-bottom: 12px;
    }
    .label {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }
    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--navy);
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-dim);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 800;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--ai-gradient);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }
    .btn-ghost {
      background: var(--surface);
      color: var(--navy);
      border: 1px solid var(--border);
    }

    /* Bottom bar */
    .bottom-bar {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(580px, calc(100% - 32px));
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 8px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      z-index: 50;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.1);
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px;
      color: var(--text-sec);
      cursor: pointer;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      border-radius: 14px;
      transition: 0.15s;
    }
    .nav-btn.active {
      color: var(--primary);
      background: var(--primary-dim);
    }
    .nav-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* Toast */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--navy);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    }
    #toast.show { opacity: 1; top: 30px; }
  </style>
</head>

<body>
  <div id="toast">Сақталды!</div>

  <div class="main">
    <header class="header">
      <button class="icon-btn" onclick="location.href='home.html'" title="Басты бет">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>
      <div class="title">
        <span>Профиль</span>
        <span class="badge" id="roleBadge">Оқушы</span>
      </div>
      <button class="icon-btn" onclick="location.href='settings.html'" title="Баптаулар">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- HERO -->
    <div class="profile-hero">
      <div class="avatar" id="avatarLetter">A</div>
      <div class="hero-info">
        <div class="hero-name" id="heroName">Азамат</div>
        <div class="hero-sub">
          <span id="heroGrade">11-сынып</span> • <span id="heroCoins">50 ◆</span> • <span id="heroXp">0 XP</span>
        </div>
      </div>
    </div>

    <!-- DYNAMIC METRICS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statQuizzes">0</div>
        <div class="stat-label">Квиздер</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statAccuracy">0%</div>
        <div class="stat-label">Дәлдік</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:var(--success)" id="statCorrect">0</div>
        <div class="stat-label">Дұрыс</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:#f59e0b" id="statStreak">0 күн</div>
        <div class="stat-label">Streak</div>
      </div>
    </div>

    <!-- EDIT PROFILE -->
    <div class="section-title">
      <span>Профиль мәліметтері</span>
    </div>
    <div class="card">
      <div class="field">
        <div class="label">Аты-жөні</div>
        <input class="input" id="nameInput" placeholder="Есіміңіз" />
      </div>
      <div class="field">
        <div class="label">Сынып</div>
        <select class="input" id="gradeSelect">
          <option value="8">8-сынып</option>
          <option value="9">9-сынып</option>
          <option value="10">10-сынып</option>
          <option value="11">11-сынып</option>
        </select>
      </div>
      <div class="field">
        <div class="label">Мақсат (ҰБТ)</div>
        <input class="input" id="goalInput" placeholder="Мысалы: 120+ балл" />
      </div>
      <button class="btn btn-primary" onclick="saveProfileData()">Сақтау</button>
    </div>

    <!-- TOPIC MASTERY -->
    <div class="section-title">
      <span>Тақырыптарды меңгеру</span>
    </div>
    <div id="topicMasteryContainer"></div>

    <!-- RECENT ACTIVITY -->
    <div class="section-title">
      <span>Соңғы тест нәтижелері</span>
      <span style="font-size:12px; color:var(--text-sec);" id="attemptsLabel">0 тест</span>
    </div>
    <div id="attemptsContainer"></div>

    <div style="margin-top:20px;">
      <button class="btn btn-primary" onclick="location.href='quiz.html?quiz=test-ent'">Жаңа тест тапсыру</button>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <nav class="bottom-bar">
    <a class="nav-btn" href="home.html">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Басты бет</span>
    </a>
    <a class="nav-btn" href="quiz.html?quiz=test-ent">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
      <span>Тесттер</span>
    </a>
    <div class="nav-btn active">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Профиль</span>
    </div>
  </nav>

  <script>
    function renderProfile() {
      if (!window.QuizStore) return;
      const stats = QuizStore.getStats();
      const user = stats.user;

      document.getElementById('avatarLetter').textContent = (user.name || 'А').charAt(0).toUpperCase();
      document.getElementById('heroName').textContent = user.name || 'Азамат';
      document.getElementById('heroGrade').textContent = `${user.grade || '11'}-сынып`;
      document.getElementById('heroCoins').textContent = `${stats.coins} ◆`;
      document.getElementById('heroXp').textContent = `${stats.xp} XP`;

      document.getElementById('nameInput').value = user.name || '';
      document.getElementById('gradeSelect').value = user.grade || '11';
      document.getElementById('goalInput').value = user.goal || 'ҰБТ 120+ балл';

      document.getElementById('statQuizzes').textContent = stats.quizzesCompleted;
      document.getElementById('statAccuracy').textContent = `${stats.accuracy}%`;
      document.getElementById('statCorrect').textContent = stats.correctAnswers;
      document.getElementById('statStreak').textContent = `${stats.streakDays} күн`;

      // Topics
      const topicBox = document.getElementById('topicMasteryContainer');
      const topicIcons = {
        "Алгоритмдер": "🔀",
        "Python бағдарламалау": "🐍",
        "Логика алгебрасы": "🧠",
        "Сандар жүйесі": "🔢",
        "Компьютерлік желілер": "🌐",
        "Дерекқорлар": "🗄️"
      };

      const topics = Object.keys(stats.topicStats || {});
      topicBox.innerHTML = topics.map(t => {
        const item = stats.topicStats[t];
        const icon = topicIcons[t] || "📚";
        return `
          <div class="card" style="padding:14px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-weight:700; font-size:13px;">${icon} ${t}</span>
              <span style="font-weight:800; color:var(--primary); font-size:13px;">${item.mastery}%</span>
            </div>
            <div class="mini-track">
              <div class="mini-fill" style="width:${item.mastery}%;"></div>
            </div>
            <div style="font-size:11px; color:var(--text-sec); margin-top:4px;">
              ${item.total > 0 ? `${item.correct}/${item.total} дұрыс жауап` : 'Әлі тест тапсырылмаған'}
            </div>
          </div>
        `;
      }).join('');

      // Attempts
      const attempts = QuizStore.getAttempts();
      document.getElementById('attemptsLabel').textContent = `${attempts.length} тест`;
      const attBox = document.getElementById('attemptsContainer');

      if (attempts.length === 0) {
        attBox.innerHTML = `
          <div class="card" style="text-align:center; padding:24px;">
            <div style="font-size:28px; margin-bottom:8px;">📝</div>
            <div style="font-weight:700;">Әзірге тесттер тапсырылмады</div>
            <div style="font-size:12px; color:var(--text-sec); margin-top:4px;">Біліміңізді тексеріп, нәтижелерді осында көріңіз!</div>
          </div>
        `;
      } else {
        attBox.innerHTML = attempts.slice(0, 8).map(a => `
          <div class="item-row" onclick="location.href='quiz.html?quiz=${a.quizId}'">
            <div>
              <div style="font-weight:700; font-size:13px;">${a.quizTitle}</div>
              <div style="font-size:11px; color:var(--text-sec);">${a.formattedDate} • ${a.correctCount}/${a.totalQuestions} дұрыс</div>
            </div>
            <span class="badge" style="${a.percentage >= 70 ? 'color:var(--primary)' : 'color:var(--danger)'}">${a.percentage}%</span>
          </div>
        `).join('');
      }
    }

    function saveProfileData() {
      if (!window.QuizStore) return;
      const name = document.getElementById('nameInput').value.trim() || 'Азамат';
      const grade = document.getElementById('gradeSelect').value;
      const goal = document.getElementById('goalInput').value.trim();

      QuizStore.saveUser({ name, grade, goal });
      showToast("Профиль сақталды!");
      renderProfile();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }

    document.addEventListener('DOMContentLoaded', renderProfile);
  </script>
</body>

</html>
